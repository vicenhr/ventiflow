<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentiFlow - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0c3339;
        }
        .btn-ventiflow {
            background-color: #2ccb74;
            color: white;
            font-weight: bold;
        }
        .btn-ventiflow:hover {
            background-color: #25ad62;
            color: white;
        }
        .logo-icon {
            background-color: #2ccb74;
            color: white;
            width: 50px;
            height: 50px;
            line-height: 50px;
            font-size: 24px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow-lg border-0 text-center" style="width: 320px; border-radius: 10px;">
    <div class="logo-icon mx-auto mb-3 fw-bold">⚡</div>
    <h2 class="text-dark mb-1 fs-4 fw-bold">VentiFlow</h2>
    <p class="text-muted small mb-4">Gestión Inteligente de Cafetería</p>

    <form id="loginForm" class="text-start">
        <div class="mb-3">
            <label for="usuario" class="form-label text-secondary small mb-1 fw-medium">Usuario</label>
            <input type="text" class="form-control px-3 py-2" id="usuario" value="Vicente" required>
        </div>
        <div class="mb-3">
            <label for="clave" class="form-label text-secondary small mb-1 fw-medium">PIN de Acceso</label>
            <input type="password" class="form-control px-3 py-2" id="clave" value="...." required>
        </div>
        <button type="submit" class="btn btn-ventiflow w-100 mt-2 py-2">Ingresar</button>
        <p id="errorMsg" class="text-danger small mt-3 text-center" style="display: none;">Credenciales incorrectas. Intenta de nuevo.</p>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/login.js"></script>
</body>
</html>
