<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentiFlow - Barra (KDS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #1a202c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .ventiflow-logo {
            background-color: #2ccb74;
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
        }

        .nav-link.active-tab {
            background-color: #e6f7ed;
            color: #1e8449 !important;
        }

        .kds-header {
            background-color: #0f172a;
            border-bottom: 2px solid #1e293b;
            padding: 15px 25px;
        }

        .panel-bg {
            background-color: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            height: calc(100vh - 160px);
            overflow-y: auto;
        }

        .ticket-card {
            background-color: white;
            color: #333;
            border-radius: 8px;
            border-left: 5px solid #3b82f6;
            margin-bottom: 15px;
        }

        .col-pendientes .ticket-card {
            border-left-color: #3b82f6;
        }

        .col-preparando .ticket-card {
            border-left-color: #0ea5e9;
        }

        .col-entregar .ticket-card {
            background-color: transparent;
            border: 1px solid #475569;
            color: white;
            border-left-color: #22c55e;
        }

        .btn-accion {
            font-weight: bold;
            border: none;
        }

        .btn-preparar {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .btn-listo {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-conectado {
            color: #2ccb74;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-desconectado {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark" href="../index.html">
                <div class="ventiflow-logo fs-5">⚡</div> VentiFlow
            </a>
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center gap-1 fw-medium text-secondary">
                <li class="nav-item"><a class="nav-link text-secondary px-3" href="pos.html">Caja/POS</a></li>
                <li class="nav-item"><a class="nav-link text-secondary px-3" href="cocina.html">Cocina</a></li>
                <li class="nav-item"><a class="nav-link active-tab fw-bold px-3 rounded" href="barra.html">Barra</a>
                </li>
                <li class="nav-item"><a class="nav-link text-secondary px-3" href="clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link text-secondary px-3" href="admin.html">Admin</a></li>
                <li class="nav-item ms-3"><a class="nav-link fw-bold text-primary" href="turnos.html"
                        target="_blank">Abrir Pantalla Pública ⧉</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 fw-bold text-secondary text-uppercase"
                style="font-size: 0.85rem;">
                <span id="nombreUsuarioNav">Cargando...</span>
                <i class="bi bi-box-arrow-right logout-icon text-danger fs-4 ms-2" style="cursor: pointer;"
                    title="Cerrar Sesión"></i>
            </div>
        </div>
    </nav>

    <div class="kds-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fw-bold d-flex align-items-center gap-2">☕ KDS - Estación Barra (Bebidas)</h4>
        <span id="conexionStatus" class="status-desconectado">⚫ Desconectado</span>
    </div>

    <div class="container-fluid p-4">
        <div class="row g-4">
            <div class="col-md-4 col-pendientes">
                <div class="panel-bg p-3">
                    <h6 class="fw-bold text-primary mb-3">🔔 PENDIENTES (BEBIDAS)</h6>
                    <div id="colPendientes"></div>
                </div>
            </div>

            <div class="col-md-4 col-preparando">
                <div class="panel-bg p-3">
                    <h6 class="fw-bold text-info mb-3">🧊 PREPARANDO</h6>
                    <div id="colPreparando"></div>
                </div>
            </div>

            <div class="col-md-4 col-entregar">
                <div class="panel-bg p-3">
                    <h6 class="fw-bold text-success mb-3">✅ PARA ENTREGAR</h6>
                    <div id="colEntregar"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/seguridad.js"></script>
    <script src="../js/barra.js"></script>
</body>

</html>
