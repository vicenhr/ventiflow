<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentiFlow - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        .ventiflow-logo { background-color: #2ccb74; color: white; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 6px; }
        .nav-link.active-tab { background-color: #e6f7ed; color: #1e8449 !important; font-weight: bold; }

        .dashboard-card { background-color: white; border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; height: 100%; }
        .card-title-sm { font-size: 0.85rem; color: #6c757d; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
        .metric-value { font-size: 2rem; font-weight: bold; color: #212529; margin-bottom: 5px; }
        .metric-trend { font-size: 0.85rem; font-weight: 500; }
        .trend-up { color: #2ccb74; }
        .trend-down { color: #e74c3c; }

        .card-kds { border: 2px solid #f1c40f; }

        .table-pedidos th { font-size: 0.85rem; color: #6c757d; border-top: none; }
        .table-pedidos td { vertical-align: middle; font-weight: 500; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-2 mb-4">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-dark" href="../index.html">
            <div class="ventiflow-logo fs-5">⚡</div> VentiFlow
        </a>
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center gap-1 fw-medium text-secondary">
            <li class="nav-item"><a class="nav-link text-secondary px-3" href="pos.html">Caja/POS</a></li>
            <li class="nav-item"><a class="nav-link text-secondary px-3" href="cocina.html">Cocina</a></li>
            <li class="nav-item"><a class="nav-link text-secondary px-3" href="barra.html">Barra</a></li>
            <li class="nav-item"><a class="nav-link text-secondary px-3" href="clientes.html">Clientes</a></li>
            <li class="nav-item"><a class="nav-link active-tab px-3 rounded" href="admin.html">Admin</a></li>
            <li class="nav-item ms-3"><a class="nav-link fw-bold text-primary" href="turnos.html" target="_blank">Abrir Pantalla Pública ⧉</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 fw-bold text-secondary text-uppercase" style="font-size: 0.85rem;">
            <span id="nombreUsuarioNav">Cargando...</span>
            <i class="bi bi-box-arrow-right logout-icon text-danger fs-4 ms-2" style="cursor: pointer;" title="Cerrar Sesión"></i>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">Dashboard General</h3>
        <select class="form-select w-auto fw-bold text-secondary shadow-sm border-0" id="filtroFecha">
            <option value="hoy">Hoy</option>
            <option value="semana">Últimos 7 días</option>
            <option value="mes">Últimos 30 días</option>
        </select>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="card-title-sm">Ventas Totales</div>
                <div class="metric-value" id="kpiVentas">$0.00</div>
                <div class="metric-trend trend-up">↑ 15% vs ayer</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="card-title-sm">Tickets Generados</div>
                <div class="metric-value" id="kpiTickets">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card card-kds">
                <div class="card-title-sm">Tiempo Promedio (KDS)</div>
                <div class="metric-value" id="kpiTiempo">0m 0s</div>
                <div class="metric-trend trend-down">↓ 30s más lento</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="card-title-sm">Producto Estrella</div>
                <div class="metric-value fs-4 mt-2" id="kpiProducto">Cargando...</div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="dashboard-card">
                <div class="card-title-sm mb-4">Flujo de Ventas (Horas)</div>
                <canvas id="graficoVentas" height="120"></canvas>
            </div>
        </div>

        <div class="col-md-5">
            <div class="dashboard-card">
                <div class="card-title-sm mb-3">Últimos Pedidos</div>
                <div class="table-responsive">
                    <table class="table table-borderless table-pedidos">
                        <tbody id="listaUltimosPedidos">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/seguridad.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
